[project]
name = "benchmarking-service"
version = "0.1.0"
description = "Pure-Python Benchmarking Service: caller-JWT attribution/routing, per-instance ROPC login to Rossoctl over httpx."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "mcp>=1.26,<2",
    "a2a-sdk>=0.3.0,<1.0",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[project.scripts]
benchmarking-service = "benchmarking_service.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/benchmarking_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
